<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 302" width="392" height="302" role="img" aria-label="COMMITS PER LANGUAGE">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <style>
    .r { opacity: 0; animation: rise .6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .9s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    text { font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', sans-serif; }
    .title { font-size: 12px; letter-spacing: 2.5px; fill: #565f89; font-weight: 700; }
    .label { font-size: 13px; fill: #9aa5ce; }
    .pct { font-size: 12.5px; fill: #565f89; }
    .num { font-size: 30px; font-weight: 700; fill: #c0caf5; }
    .cap { font-size: 11.5px; letter-spacing: 1.5px; fill: #565f89; }
  </style>
  <rect width="392" height="302" rx="12" fill="url(#bg)"/>
  <text class="title r" style="animation-delay:0ms" x="24" y="32">COMMITS PER LANGUAGE</text>

  <g class="r" style="animation-delay:120ms">
    <circle cx="30" cy="54" r="5" fill="#f34b7d"/>
    <text class="label" x="46" y="58">C++</text>
    <text class="pct" x="368" y="58" text-anchor="end">74.9%</text>
    <rect x="24" y="66" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:260ms" x="24" y="66" width="257.6" height="7" rx="3.5" fill="#f34b7d"/>
  </g>
  <g class="r" style="animation-delay:230ms">
    <circle cx="30" cy="96" r="5" fill="#dea584"/>
    <text class="label" x="46" y="100">Rust</text>
    <text class="pct" x="368" y="100" text-anchor="end">23.1%</text>
    <rect x="24" y="108" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:370ms" x="24" y="108" width="79.6" height="7" rx="3.5" fill="#dea584"/>
  </g>
  <g class="r" style="animation-delay:340ms">
    <circle cx="30" cy="138" r="5" fill="#3178c6"/>
    <text class="label" x="46" y="142">TypeScript</text>
    <text class="pct" x="368" y="142" text-anchor="end">1.8%</text>
    <rect x="24" y="150" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:480ms" x="24" y="150" width="6.0" height="7" rx="3.5" fill="#3178c6"/>
  </g>
  <g class="r" style="animation-delay:450ms">
    <circle cx="30" cy="180" r="5" fill="#e34c26"/>
    <text class="label" x="46" y="184">HTML</text>
    <text class="pct" x="368" y="184" text-anchor="end">0.1%</text>
    <rect x="24" y="192" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:590ms" x="24" y="192" width="0.4" height="7" rx="3.5" fill="#e34c26"/>
  </g>
  <g class="r" style="animation-delay:560ms">
    <circle cx="30" cy="222" r="5" fill="#3572A5"/>
    <text class="label" x="46" y="226">Python</text>
    <text class="pct" x="368" y="226" text-anchor="end">0.1%</text>
    <rect x="24" y="234" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:700ms" x="24" y="234" width="0.3" height="7" rx="3.5" fill="#3572A5"/>
  </g>
  <g class="r" style="animation-delay:670ms">
    <circle cx="30" cy="264" r="5" fill="#565f89"/>
    <text class="label" x="46" y="268">Other</text>
    <text class="pct" x="368" y="268" text-anchor="end">0.0%</text>
    <rect x="24" y="276" width="344" height="7" rx="3.5" fill="#292e42"/>
    <rect class="bar" style="animation-delay:810ms" x="24" y="276" width="0.1" height="7" rx="3.5" fill="#565f89"/>
  </g>
</svg>

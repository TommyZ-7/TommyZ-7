<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 208" width="392" height="208" role="img" aria-label="COMMITS PER LANGUAGE">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <style>
    .r { opacity: 0; animation: rise .6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .9s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    text { font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', sans-serif; }
    .title { font-size: 12px; letter-spacing: 2.5px; fill: #565f89; font-weight: 700; }
    .label { font-size: 13px; fill: #9aa5ce; }
    .pct { font-size: 12.5px; fill: #565f89; }
    .num { font-size: 30px; font-weight: 700; fill: #c0caf5; }
    .cap { font-size: 11.5px; letter-spacing: 1.5px; fill: #565f89; }

    .seg0 { animation: seg0 .9s ease-out 200ms forwards; }
    @keyframes seg0 { from { stroke-dasharray: 0 100; } }
    .seg1 { animation: seg1 .9s ease-out 320ms forwards; }
    @keyframes seg1 { from { stroke-dasharray: 0 100; } }
    .seg2 { animation: seg2 .9s ease-out 440ms forwards; }
    @keyframes seg2 { from { stroke-dasharray: 0 100; } }
    .seg3 { animation: seg3 .9s ease-out 560ms forwards; }
    @keyframes seg3 { from { stroke-dasharray: 0 100; } }
    .seg4 { animation: seg4 .9s ease-out 680ms forwards; }
    @keyframes seg4 { from { stroke-dasharray: 0 100; } }
    .seg5 { animation: seg5 .9s ease-out 800ms forwards; }
    @keyframes seg5 { from { stroke-dasharray: 0 100; } }
  </style>
  <rect width="392" height="208" rx="12" fill="url(#bg)"/>
  <text class="title r" style="animation-delay:0ms" x="24" y="32">COMMITS PER LANGUAGE</text>
  <circle cx="102" cy="116" r="64" fill="none" stroke="#292e42" stroke-width="24"/>
  <circle cx="102" cy="116" r="64" fill="none" stroke="#dea584" stroke-width="24"
      pathLength="100" stroke-dasharray="51.30 48.70" stroke-dashoffset="25.00"
      class="seg0" />
  <circle cx="102" cy="116" r="64" fill="none" stroke="#3178c6" stroke-width="24"
      pathLength="100" stroke-dasharray="39.39 60.61" stroke-dashoffset="-26.30"
      class="seg1" />
  <circle cx="102" cy="116" r="64" fill="none" stroke="#3572A5" stroke-width="24"
      pathLength="100" stroke-dasharray="5.72 94.28" stroke-dashoffset="-65.69"
      class="seg2" />
  <circle cx="102" cy="116" r="64" fill="none" stroke="#f34b7d" stroke-width="24"
      pathLength="100" stroke-dasharray="2.05 97.95" stroke-dashoffset="-71.41"
      class="seg3" />
  <circle cx="102" cy="116" r="64" fill="none" stroke="#e34c26" stroke-width="24"
      pathLength="100" stroke-dasharray="0.99 99.01" stroke-dashoffset="-73.46"
      class="seg4" />
  <circle cx="102" cy="116" r="64" fill="none" stroke="#565f89" stroke-width="24"
      pathLength="100" stroke-dasharray="0.55 99.45" stroke-dashoffset="-74.45"
      class="seg5" />
  <g class="r" style="animation-delay:500ms" text-anchor="middle">
    <text x="102" y="114" font-size="16" font-weight="700" fill="#c0caf5">Rust</text>
    <text x="102" y="134" font-size="12.5" fill="#565f89">51.3%</text>
  </g>

  <g class="r" style="animation-delay:150ms">
    <circle cx="212" cy="62" r="5" fill="#dea584"/>
    <text class="label" x="228" y="66">Rust</text>
    <text class="pct" x="370" y="66" text-anchor="end">51.3%</text>
  </g>
  <g class="r" style="animation-delay:250ms">
    <circle cx="212" cy="85" r="5" fill="#3178c6"/>
    <text class="label" x="228" y="89">TypeScript</text>
    <text class="pct" x="370" y="89" text-anchor="end">39.4%</text>
  </g>
  <g class="r" style="animation-delay:350ms">
    <circle cx="212" cy="108" r="5" fill="#3572A5"/>
    <text class="label" x="228" y="112">Python</text>
    <text class="pct" x="370" y="112" text-anchor="end">5.7%</text>
  </g>
  <g class="r" style="animation-delay:450ms">
    <circle cx="212" cy="131" r="5" fill="#f34b7d"/>
    <text class="label" x="228" y="135">C++</text>
    <text class="pct" x="370" y="135" text-anchor="end">2.1%</text>
  </g>
  <g class="r" style="animation-delay:550ms">
    <circle cx="212" cy="154" r="5" fill="#e34c26"/>
    <text class="label" x="228" y="158">HTML</text>
    <text class="pct" x="370" y="158" text-anchor="end">1.0%</text>
  </g>
  <g class="r" style="animation-delay:650ms">
    <circle cx="212" cy="177" r="5" fill="#565f89"/>
    <text class="label" x="228" y="181">Other</text>
    <text class="pct" x="370" y="181" text-anchor="end">0.6%</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="Stats">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
  </defs>
  <style>
    .r { opacity: 0; animation: rise .6s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .9s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    text { font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans CJK JP', sans-serif; }
    .title { font-size: 12px; letter-spacing: 2.5px; fill: #565f89; font-weight: 700; }
    .label { font-size: 13px; fill: #9aa5ce; }
    .pct { font-size: 12.5px; fill: #565f89; }
    .num { font-size: 30px; font-weight: 700; fill: #c0caf5; }
    .cap { font-size: 11.5px; letter-spacing: 1.5px; fill: #565f89; }
  </style>
  <rect width="800" height="150" rx="12" fill="url(#bg)"/>
  <text class="title r" style="animation-delay:0ms" x="24" y="32">STATS</text>

  <g class="r" style="animation-delay:150ms" text-anchor="middle">
    <text class="num" x="94.0" y="76">2</text>
    <text class="cap" x="94.0" y="102">TOTAL STARS</text>
  </g>
  <g class="r" style="animation-delay:250ms" text-anchor="middle">
    <text class="num" x="246.0" y="76">2020</text>
    <text class="cap" x="246.0" y="102">COMMITS (1Y)</text>
  </g>
  <g class="r" style="animation-delay:350ms" text-anchor="middle">
    <text class="num" x="398.0" y="76">336</text>
    <text class="cap" x="398.0" y="102">PULL REQUESTS</text>
  </g>
  <g class="r" style="animation-delay:450ms" text-anchor="middle">
    <text class="num" x="550.0" y="76">126</text>
    <text class="cap" x="550.0" y="102">ISSUES</text>
  </g>
  <g class="r" style="animation-delay:550ms" text-anchor="middle">
    <text class="num" x="702.0" y="76">16</text>
    <text class="cap" x="702.0" y="102">REPOSITORIES</text>
  </g>
</svg>
